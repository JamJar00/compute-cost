name: Update AWS prices

on:
  schedule:
    - cron: '17 6 1 * *'
  workflow_dispatch:

concurrency:
  group: update-aws-prices
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Fetch current AWS prices
        run: python scripts/update_aws_prices.py
      - name: Commit updated prices
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/aws-prices.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update AWS prices"
            git push
          fi
